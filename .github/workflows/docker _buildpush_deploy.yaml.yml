name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.NEW_TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Generate New Tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          NEW_TAG="3tier-${SHORT_SHA}"
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT
        # run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build Docker Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/k8s-rating-frontend:${{ steps.tag.outputs.NEW_TAG }} --build-arg VITE_API_URL=http://myapp.local/api ./Frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-rating-app:${{ steps.tag.outputs.NEW_TAG }} ./Backend
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -q
          sudo apt-get install -y trivy

      - name: Run Trivy scan on frontend
        run: |
          trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --format table ${{ secrets.DOCKERHUB_USERNAME }}/k8s-rating-frontend:${{ steps.tag.outputs.NEW_TAG }}

      - name: Run Trivy scan on backend
        run: |
          trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed --format table ${{ secrets.DOCKERHUB_USERNAME }}/backend-rating-app:${{ steps.tag.outputs.NEW_TAG }}

      - name: SonarQube Scan (Frontend + Backend)
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=my-three-tier-app
            -Dsonar.sources=Frontend,Backend
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/k8s-rating-frontend:${{ steps.tag.outputs.NEW_TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-rating-app:${{ steps.tag.outputs.NEW_TAG }}

      
  deploy:
    name: Deploy to EKS using Helm
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Kind & Kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Create Kind Cluster
        run: |
          kind create cluster --name my-cluster
          kubectl cluster-info
      - name: Configure kubeconfig for Kind cluster
        run: |
           kubectl cluster-info --context kind-my-cluster
           kubectl get nodes

      - name: Helm Deploy
        run: |
          helm upgrade --install rating-app  ./rating-app\
            --namespace project4 \
            --create-namespace \
            --set frontend.image=${{ secrets.DOCKERHUB_USERNAME }}/k8s-rating-frontend:${{ needs.build-and-push.outputs.tag }} \
            --set backend.image=${{ secrets.DOCKERHUB_USERNAME }}/backend-rating-app:${{ needs.build-and-push.outputs.tag }}
